<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PACHI LOG">
  <link rel="manifest" href="manifest.webmanifest">
  <title>収支ログ | 実戦データ</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: rgba(255, 255, 255, .88);
      --surface-solid: #fff;
      --surface-muted: #eef2f7;
      --text: #172033;
      --muted: #738096;
      --line: #e4e9f1;
      --primary: #3867f4;
      --primary-soft: #e8edff;
      --success: #139b67;
      --success-soft: #dff7ed;
      --danger: #e4565c;
      --danger-soft: #fde7e8;
      --shadow: 0 12px 35px rgba(36, 51, 83, .08);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #101522;
      --surface: rgba(25, 33, 49, .9);
      --surface-solid: #192131;
      --surface-muted: #232d40;
      --text: #f2f5fb;
      --muted: #9ba7bb;
      --line: #303b50;
      --primary: #83a0ff;
      --primary-soft: #263665;
      --success: #54d69e;
      --success-soft: #1d493c;
      --danger: #ff858a;
      --danger-soft: #542d36;
      --shadow: 0 18px 45px rgba(0, 0, 0, .2);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      min-width: 320px;
      margin: 0;
      padding: 0 0 calc(92px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 10% -5%, var(--primary-soft), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background .2s ease, color .2s ease;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app-shell { width: min(100%, 760px); margin: 0 auto; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: max(18px, env(safe-area-inset-top)) 20px 16px;
      background: rgba(245, 247, 251, .94);
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(228, 233, 241, .75);
      border-bottom-color: color-mix(in srgb, var(--line) 70%, transparent);
    }
    [data-theme="dark"] .topbar { background: rgba(16, 21, 34, .94); }
    .eyebrow {
      margin: 0 0 3px;
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .11em;
    }
    .topbar h1 { margin: 0; font-size: 21px; letter-spacing: -.03em; }
    .theme-toggle, .icon-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(30, 45, 75, .06);
    }
    .theme-toggle svg, .icon-button svg { width: 19px; height: 19px; }
    .content { padding: 20px 16px 0; }
    .view { display: none; animation: appear .22s ease both; }
    .view.active { display: block; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .welcome {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 4px 18px;
    }
    .welcome h2 { margin: 0; font-size: 27px; letter-spacing: -.05em; }
    .welcome p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .section-label {
      margin: 26px 4px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .card {
      margin-bottom: 14px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-color: color-mix(in srgb, var(--line) 75%, transparent);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .quick-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 18px;
    }
    .quick-stat {
      min-width: 0;
      padding: 14px 11px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
    }
    .quick-stat span { display: block; color: var(--muted); font-size: 11px; }
    .quick-stat strong {
      display: block;
      overflow: hidden;
      margin-top: 6px;
      font-size: 16px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .positive { color: var(--success) !important; }
    .negative { color: var(--danger) !important; }
    .form-heading, .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 17px;
    }
    .form-heading h3, .card-heading h3 { margin: 0; font-size: 16px; }
    .form-heading p, .card-heading p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .input-row { margin-bottom: 13px; }
    .input-row:last-child { margin-bottom: 0; }
    label {
      display: block;
      margin: 0 0 7px 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      background: var(--surface-solid);
      color: var(--text);
      font-size: 16px;
      transition: border .15s, box-shadow .15s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(56, 103, 244, .17);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 17%, transparent);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .primary-button {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      padding: 15px 16px;
      border: 0;
      border-radius: 14px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 9px 20px rgba(56, 103, 244, .3);
      box-shadow: 0 9px 20px color-mix(in srgb, var(--primary) 30%, transparent);
    }
    .primary-button:active, .ghost-button:active, .tab-item:active { transform: scale(.98); }
    .ghost-button {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .toolbar { display: flex; gap: 9px; margin-bottom: 14px; }
    .toolbar input { flex: 1; min-width: 0; padding: 11px 13px; font-size: 14px; }
    .empty-state { padding: 38px 18px; text-align: center; }
    .empty-icon {
      display: grid;
      width: 54px;
      height: 54px;
      margin: 0 auto 13px;
      place-items: center;
      border-radius: 18px;
      background: var(--primary-soft);
      color: var(--primary);
    }
    .empty-state h3 { margin: 0 0 6px; font-size: 16px; }
    .empty-state p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .log-card { padding: 16px; }
    .log-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .log-date { font-size: 14px; font-weight: 800; }
    .tag-badge {
      max-width: 52%;
      overflow: hidden;
      padding: 5px 9px;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .balance-row { display: flex; align-items: baseline; justify-content: space-between; margin: 15px 0 12px; }
    .balance-row span { color: var(--muted); font-size: 12px; }
    .balance-row strong { font-size: 21px; letter-spacing: -.04em; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); padding-top: 12px; border-top: 1px solid var(--line); }
    .metric { min-width: 0; }
    .metric:not(:first-child) { padding-left: 12px; border-left: 1px solid var(--line); }
    .metric small { display: block; color: var(--muted); font-size: 10px; }
    .metric b { display: block; margin-top: 4px; font-size: 13px; }
    .delete-button {
      display: block;
      margin: 13px 0 -3px auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
    }
    .stat-hero {
      padding: 23px 20px;
      background: linear-gradient(135deg, var(--primary), #704df0);
      border: 0;
      color: #fff;
    }
    .stat-hero span { display: block; opacity: .78; font-size: 12px; font-weight: 700; }
    .stat-hero strong { display: block; margin: 5px 0 16px; font-size: 34px; letter-spacing: -.06em; }
    .stat-hero .hero-meta { display: flex; gap: 22px; }
    .hero-meta b { display: block; font-size: 15px; }
    .hero-meta small { display: block; margin-top: 2px; opacity: .7; font-size: 10px; }
    .chart-wrap { overflow: hidden; }
    .chart {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      height: 170px;
      padding: 12px 2px 0;
      border-bottom: 1px solid var(--line);
    }
    .bar-group { display: flex; min-width: 40px; height: 100%; flex: 1; flex-direction: column; align-items: center; justify-content: flex-end; gap: 7px; }
    .bar {
      width: min(30px, 70%);
      min-height: 4px;
      border-radius: 8px 8px 3px 3px;
      background: var(--success);
      transition: height .3s ease;
    }
    .bar.loss { background: var(--danger); }
    .bar-label { overflow: hidden; width: 100%; color: var(--muted); font-size: 10px; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    .chart-value { max-width: 100%; overflow: hidden; color: var(--muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .tag-stat { padding: 16px; }
    .tag-stat h4 { overflow: hidden; margin: 0; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
    .tag-stat .tag-balance { margin: 7px 0 13px; font-size: 18px; font-weight: 800; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 99px; background: var(--surface-muted); }
    .progress-bar { height: 100%; border-radius: inherit; background: var(--primary); }
    .stat-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 13px; }
    .stat-details span { display: block; color: var(--muted); font-size: 10px; }
    .stat-details b { display: block; margin-top: 4px; font-size: 12px; }
    .tab-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      padding: 8px 12px max(8px, env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, .96);
      background: color-mix(in srgb, var(--surface-solid) 88%, transparent);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    [data-theme="dark"] .tab-bar { background: rgba(25, 33, 49, .96); }
    .tab-inner { display: flex; width: min(100%, 760px); gap: 4px; }
    .tab-item {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 4px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .tab-item svg { width: 21px; height: 21px; }
    .tab-item.active { background: var(--primary-soft); color: var(--primary); }
    .toast {
      position: fixed;
      right: 16px;
      bottom: 94px;
      left: 16px;
      z-index: 30;
      max-width: 440px;
      margin: auto;
      padding: 12px 15px;
      border-radius: 12px;
      background: var(--text);
      color: var(--bg);
      font-size: 13px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (min-width: 640px) {
      .content { padding: 28px 24px 0; }
      .topbar { padding-right: 24px; padding-left: 24px; }
      .quick-stat { padding: 17px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PACHI LOG</p>
        <h1 id="viewTitle">データ入力</h1>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="ダークモード切替"></button>
    </header>

    <main class="content">
      <section id="view-input" class="view active">
        <div class="welcome">
          <div>
            <h2>今日の実戦を記録</h2>
            <p>数字を残して、次の立ち回りに活かそう。</p>
          </div>
        </div>
        <div class="quick-stats">
          <div class="quick-stat"><span>累計収支</span><strong id="quickBalance">0円</strong></div>
          <div class="quick-stat"><span>実戦回数</span><strong id="quickSessions">0回</strong></div>
          <div class="quick-stat"><span>総回転数</span><strong id="quickRotations">0回転</strong></div>
        </div>
        <div class="card">
          <div class="form-heading">
            <div><h3>実戦データ</h3><p>あとから履歴と集計で確認できます</p></div>
          </div>
          <div class="input-row">
            <label for="date">日付</label>
            <input type="date" id="date">
          </div>
          <div class="input-row">
            <label for="tag">タグ（機種名や確率帯）</label>
            <input type="text" id="tag" placeholder="例：エヴァ15 / 1⁄319" maxlength="60">
          </div>
          <div class="grid-2">
            <div class="input-row">
              <label for="investment">投資（円）</label>
              <input type="number" id="investment" placeholder="0" min="0" inputmode="numeric">
            </div>
            <div class="input-row">
              <label for="return">回収（円）</label>
              <input type="number" id="return" placeholder="0" min="0" inputmode="numeric">
            </div>
          </div>
          <div class="grid-2">
            <div class="input-row">
              <label for="rotations">総回転数</label>
              <input type="number" id="rotations" placeholder="0" min="0" inputmode="numeric">
            </div>
            <div class="input-row">
              <label for="hits">初当たり回数</label>
              <input type="number" id="hits" placeholder="0" min="0" inputmode="numeric">
            </div>
          </div>
          <div class="input-row">
            <label for="rush">RUSH突入回数</label>
            <input type="number" id="rush" placeholder="0" min="0" inputmode="numeric">
          </div>
          <button class="primary-button" id="saveButton" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            データを保存する
          </button>
        </div>
      </section>

      <section id="view-history" class="view">
        <div class="welcome">
          <div><h2>実戦履歴</h2><p id="historyCount">保存されたデータ</p></div>
        </div>
        <div class="toolbar">
          <input id="historySearch" type="search" placeholder="タグや日付で検索" aria-label="履歴を検索">
          <button class="ghost-button" id="exportButton" type="button">CSV出力</button>
        </div>
        <div id="historyList"></div>
      </section>

      <section id="view-stats" class="view">
        <div class="welcome">
          <div><h2>パフォーマンス</h2><p>記録した実戦をまとめて分析</p></div>
        </div>
        <div class="card stat-hero">
          <span>トータル収支</span>
          <strong id="totalBalance">0円</strong>
          <div class="hero-meta">
            <div><b id="statSessions">0</b><small>実戦回数</small></div>
            <div><b id="statAverage">0円</b><small>1回あたり</small></div>
            <div><b id="statRush">—</b><small>RUSH突入率</small></div>
          </div>
        </div>
        <div class="card chart-wrap">
          <div class="card-heading"><div><h3>タグ別の収支</h3><p>プラスは緑、マイナスは赤</p></div></div>
          <div id="balanceChart" class="chart"></div>
        </div>
        <p class="section-label">タグ別詳細</p>
        <div id="tagStats"></div>
      </section>
    </main>
  </div>

  <nav class="tab-bar" aria-label="メインナビゲーション">
    <div class="tab-inner">
      <button class="tab-item active" data-view="input" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v18M3 12h18" stroke-linecap="round"/></svg>
        <span>入力</span>
      </button>
      <button class="tab-item" data-view="history" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13Z"/><path d="M8 7h8M8 11h8M8 15h5" stroke-linecap="round"/></svg>
        <span>履歴</span>
      </button>
      <button class="tab-item" data-view="stats" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 20V10M12 20V4M19 20v-7" stroke-linecap="round"/></svg>
        <span>集計</span>
      </button>
    </div>
  </nav>
  <div id="toast" class="toast" role="status"></div>

  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }
    const STORAGE_KEY = "pachi_logs";
    const THEME_KEY = "pachi_theme";
    const memoryStorage = {};
    let db = readDatabase();
    let toastTimer;

    const $ = (id) => document.getElementById(id);
    const formatYen = (value) => `${Number(value || 0).toLocaleString("ja-JP")}円`;
    const formatDate = (value) => {
      if (!value) return "日付なし";
      const date = new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString("ja-JP", { year: "numeric", month: "short", day: "numeric", weekday: "short" });
    };
    const balanceOf = (item) => Number(item.returnValue || 0) - Number(item.investment || 0);
    const rushRateOf = (hits, rush) => Number(hits) > 0 ? `${((Number(rush) / Number(hits)) * 100).toFixed(1)}%` : "—";
    const localToday = () => {
      const d = new Date();
      return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-");
    };

    function readDatabase() {
      try {
        const value = JSON.parse(getStored(STORAGE_KEY) || "[]");
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    // Safari may block localStorage for HTML files opened from Files/downloads.
    // Keep the app usable in that case with a session-only in-memory fallback.
    function getStored(key) {
      try {
        return localStorage.getItem(key);
      } catch {
        return Object.prototype.hasOwnProperty.call(memoryStorage, key) ? memoryStorage[key] : null;
      }
    }

    function setStored(key, value) {
      memoryStorage[key] = value;
      try {
        localStorage.setItem(key, value);
      } catch {
        // The in-memory copy keeps this session working when storage is blocked.
      }
    }

    function persist() {
      setStored(STORAGE_KEY, JSON.stringify(db));
    }

    function showToast(message) {
      $("toast").textContent = message;
      $("toast").classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2200);
    }

    function showView(view) {
      document.querySelectorAll(".view").forEach((section) => section.classList.toggle("active", section.id === `view-${view}`));
      document.querySelectorAll(".tab-item").forEach((tab) => tab.classList.toggle("active", tab.dataset.view === view));
      $("viewTitle").textContent = { input: "データ入力", history: "実戦履歴", stats: "パフォーマンス" }[view];
      if (view === "history") renderHistory();
      if (view === "stats") renderStats();
      updateQuickStats();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateQuickStats() {
      const total = db.reduce((sum, item) => sum + balanceOf(item), 0);
      const rotations = db.reduce((sum, item) => sum + Number(item.rotations || 0), 0);
      $("quickBalance").textContent = formatYen(total);
      $("quickBalance").className = total >= 0 ? "positive" : "negative";
      $("quickSessions").textContent = `${db.length}回`;
      $("quickRotations").textContent = `${rotations.toLocaleString("ja-JP")}回転`;
    }

    function saveData() {
      const values = ["investment", "returnValue", "rotations", "hits", "rush"].map((id) => Math.max(0, Number($(id === "returnValue" ? "return" : id).value) || 0));
      const [investment, returnValue, rotations, hits, rush] = values;
      const date = $("date").value || localToday();
      const tag = $("tag").value.trim() || "未分類";
      if (rush > hits && hits > 0) {
        showToast("RUSH回数は初当たり回数以下で入力してください");
        return;
      }
      db.push({ id: Date.now(), date, tag, investment, returnValue, rotations, hits, rush });
      persist();
      ["tag", "investment", "return", "rotations", "hits", "rush"].forEach((id) => $(id).value = "");
      updateQuickStats();
      showToast("データを保存しました");
    }

    function makeMetric(label, value) {
      const wrapper = document.createElement("div");
      wrapper.className = "metric";
      const small = document.createElement("small");
      small.textContent = label;
      const bold = document.createElement("b");
      bold.textContent = value;
      wrapper.append(small, bold);
      return wrapper;
    }

    function createLogCard(item) {
      const card = document.createElement("article");
      card.className = "card log-card";
      const top = document.createElement("div");
      top.className = "log-top";
      const date = document.createElement("strong");
      date.className = "log-date";
      date.textContent = formatDate(item.date);
      const tag = document.createElement("span");
      tag.className = "tag-badge";
      tag.textContent = item.tag || "未分類";
      top.append(date, tag);

      const balanceRow = document.createElement("div");
      balanceRow.className = "balance-row";
      const balanceLabel = document.createElement("span");
      balanceLabel.textContent = "収支";
      const balance = document.createElement("strong");
      balance.className = balanceOf(item) >= 0 ? "positive" : "negative";
      balance.textContent = `${balanceOf(item) >= 0 ? "+" : ""}${formatYen(balanceOf(item))}`;
      balanceRow.append(balanceLabel, balance);

      const metrics = document.createElement("div");
      metrics.className = "metric-grid";
      metrics.append(
        makeMetric("投資 / 回収", `${Number(item.investment || 0).toLocaleString("ja-JP")} / ${Number(item.returnValue || 0).toLocaleString("ja-JP")}`),
        makeMetric("総回転数", `${Number(item.rotations || 0).toLocaleString("ja-JP")}回`),
        makeMetric("RUSH突入率", rushRateOf(item.hits, item.rush))
      );

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-button";
      deleteButton.type = "button";
      deleteButton.textContent = "この記録を削除";
      deleteButton.addEventListener("click", () => deleteLog(item.id));
      card.append(top, balanceRow, metrics, deleteButton);
      return card;
    }

    function renderHistory() {
      const list = $("historyList");
      const query = $("historySearch").value.trim().toLowerCase();
      const filtered = [...db].reverse().filter((item) => `${item.tag} ${item.date}`.toLowerCase().includes(query));
      $("historyCount").textContent = `${filtered.length}件表示 / 全${db.length}件`;
      list.replaceChildren();
      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "card empty-state";
        const icon = document.createElement("div");
        icon.className = "empty-icon";
        icon.innerHTML = '<svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M8 7h8M8 11h8M8 15h5" stroke-linecap="round"/></svg>';
        const title = document.createElement("h3");
        title.textContent = query ? "該当する履歴がありません" : "まだ記録がありません";
        const text = document.createElement("p");
        text.textContent = query ? "別のタグ名や日付で検索してみてください。" : "入力タブから、今日の実戦データを追加できます。";
        empty.append(icon, title, text);
        list.append(empty);
        return;
      }
      filtered.forEach((item) => list.append(createLogCard(item)));
    }

    function deleteLog(id) {
      if (!confirm("この記録を削除しますか？")) return;
      db = db.filter((item) => item.id !== id);
      persist();
      renderHistory();
      updateQuickStats();
      showToast("記録を削除しました");
    }

    function renderStats() {
      const total = db.reduce((sum, item) => sum + balanceOf(item), 0);
      const totalHits = db.reduce((sum, item) => sum + Number(item.hits || 0), 0);
      const totalRush = db.reduce((sum, item) => sum + Number(item.rush || 0), 0);
      $("totalBalance").textContent = `${total >= 0 ? "+" : ""}${formatYen(total)}`;
      $("statSessions").textContent = db.length;
      $("statAverage").textContent = db.length ? formatYen(Math.round(total / db.length)) : "0円";
      $("statRush").textContent = rushRateOf(totalHits, totalRush);
      $("totalBalance").className = total >= 0 ? "positive" : "negative";

      const groups = {};
      db.forEach((item) => {
        const key = item.tag || "未分類";
        if (!groups[key]) groups[key] = { balance: 0, rotations: 0, hits: 0, rush: 0 };
        groups[key].balance += balanceOf(item);
        groups[key].rotations += Number(item.rotations || 0);
        groups[key].hits += Number(item.hits || 0);
        groups[key].rush += Number(item.rush || 0);
      });
      const entries = Object.entries(groups).sort((a, b) => b[1].balance - a[1].balance);
      const maxBalance = Math.max(...entries.map(([, group]) => Math.abs(group.balance)), 1);
      const chart = $("balanceChart");
      chart.replaceChildren();
      if (!entries.length) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "データを保存すると、ここにグラフが表示されます。";
        chart.append(empty);
      } else {
        entries.slice(0, 8).forEach(([tag, group]) => {
          const barGroup = document.createElement("div");
          barGroup.className = "bar-group";
          const value = document.createElement("span");
          value.className = "chart-value";
          value.textContent = `${group.balance >= 0 ? "+" : ""}${Math.round(group.balance / 1000)}千`;
          const bar = document.createElement("div");
          bar.className = `bar${group.balance < 0 ? " loss" : ""}`;
          bar.style.height = `${Math.max(5, Math.round(Math.abs(group.balance) / maxBalance * 105))}px`;
          bar.title = `${tag}: ${formatYen(group.balance)}`;
          const label = document.createElement("span");
          label.className = "bar-label";
          label.textContent = tag;
          label.title = tag;
          barGroup.append(value, bar, label);
          chart.append(barGroup);
        });
      }

      const stats = $("tagStats");
      stats.replaceChildren();
      if (!entries.length) return;
      entries.forEach(([tag, group]) => {
        const card = document.createElement("article");
        card.className = "card tag-stat";
        const heading = document.createElement("h4");
        heading.textContent = tag;
        const balance = document.createElement("div");
        balance.className = `tag-balance ${group.balance >= 0 ? "positive" : "negative"}`;
        balance.textContent = `${group.balance >= 0 ? "+" : ""}${formatYen(group.balance)}`;
        const track = document.createElement("div");
        track.className = "progress-track";
        const progress = document.createElement("div");
        progress.className = "progress-bar";
        progress.style.width = `${Math.max(4, Math.round(Math.abs(group.balance) / maxBalance * 100))}%`;
        progress.style.background = group.balance >= 0 ? "var(--success)" : "var(--danger)";
        track.append(progress);
        const details = document.createElement("div");
        details.className = "stat-details";
        details.append(
          makeMetric("合算確率", group.hits > 0 ? `1/${(group.rotations / group.hits).toFixed(1)}` : "—"),
          makeMetric("RUSH率", rushRateOf(group.hits, group.rush)),
          makeMetric("実戦回数", `${db.filter((item) => (item.tag || "未分類") === tag).length}回`)
        );
        card.append(heading, balance, track, details);
        stats.append(card);
      });
    }

    function exportCSV() {
      if (!db.length) {
        showToast("出力するデータがありません");
        return;
      }
      const headers = ["日付", "タグ", "投資", "回収", "収支", "総回転数", "初当たり", "RUSH"];
      const rows = db.map((item) => [item.date, item.tag, item.investment, item.returnValue, balanceOf(item), item.rotations, item.hits, item.rush]);
      const csv = [headers, ...rows].map((row) => row.map((value) => `"${String(value).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `pachi-log-${localToday()}.csv`;
      link.click();
      URL.revokeObjectURL(url);
      showToast("CSVを出力しました");
    }

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      setStored(THEME_KEY, theme);
      $("themeToggle").innerHTML = theme === "dark"
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg>';
    }

    $("date").value = localToday();
    setTheme(getStored(THEME_KEY) || "light");
    document.querySelectorAll(".tab-item").forEach((tab) => tab.addEventListener("click", () => showView(tab.dataset.view)));
    $("saveButton").addEventListener("click", saveData);
    $("historySearch").addEventListener("input", renderHistory);
    $("exportButton").addEventListener("click", exportCSV);
    $("themeToggle").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
    updateQuickStats();
  </script>
</body>
</html>
